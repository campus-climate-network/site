version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One grouped PR per week for semver-compatible bumps; majors arrive
    # as individual PRs so each migration can be reviewed on its own.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Lint chain (typescript-eslint) caps TypeScript below 6.1 — remove
      # this once eslint-config-next's toolchain supports TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Types should track the deployed Node runtime (engines: >=22).
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
